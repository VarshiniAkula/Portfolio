<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Coding robot">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4b52"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#c9d3dc"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b24"/>
      <stop offset="1" stop-color="#06222a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="160" cy="36" r="56" fill="#00F2FF" opacity="0.10"/>

    <!-- antenna -->
    <path d="M100 30 V46" stroke="#c9d3dc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="26" r="7" fill="#00F2FF"/>
    <circle cx="100" cy="26" r="12" fill="#00F2FF" opacity="0.2"/>

    <!-- ears -->
    <rect x="40" y="70" width="12" height="30" rx="5" fill="#9fb0bf"/>
    <rect x="148" y="70" width="12" height="30" rx="5" fill="#9fb0bf"/>

    <!-- head -->
    <rect x="50" y="46" width="100" height="78" rx="26" fill="url(#metal)"/>
    <!-- face screen -->
    <rect x="62" y="58" width="76" height="54" rx="16" fill="url(#screen)"/>
    <!-- eyes -->
    <rect x="78" y="74" width="12" height="16" rx="6" fill="#00F2FF"/>
    <rect x="110" y="74" width="12" height="16" rx="6" fill="#00F2FF"/>
    <circle cx="86" cy="78" r="2.2" fill="#e8feff"/>
    <circle cx="118" cy="78" r="2.2" fill="#e8feff"/>
    <!-- smile -->
    <path d="M89 98 C95 104 105 104 111 98" stroke="#00F2FF" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="72" cy="98" r="4" fill="#ff8fa3" opacity="0.55"/>
    <circle cx="128" cy="98" r="4" fill="#ff8fa3" opacity="0.55"/>

    <!-- body -->
    <path d="M56 200 C56 160 72 136 100 136 C128 136 144 160 144 200 Z" fill="url(#metal)"/>
    <rect x="88" y="124" width="24" height="14" rx="4" fill="#9fb0bf"/>

    <!-- laptop -->
    <path d="M48 196 L64 150 H136 L152 196 Z" fill="#1b2430"/>
    <path d="M68 155 H132 L144 190 H56 Z" fill="#0c141c"/>
    <text x="100" y="180" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#00F2FF">&lt;/&gt;</text>
    <rect x="36" y="194" width="128" height="8" rx="4" fill="#2a3644"/>

    <!-- hands on keyboard -->
    <ellipse cx="62" cy="192" rx="10" ry="7" fill="#dfe6ec"/>
    <ellipse cx="138" cy="192" rx="10" ry="7" fill="#dfe6ec"/>
  </g>
</svg>
